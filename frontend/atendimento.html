```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atendimento — Sistema Hospitalar</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h2>🏥 Atendimento</h2>

        <!-- Dados pessoais -->

        <input
            type="text"
            id="nome"
            placeholder="Nome completo"
        >

        <input
            type="text"
            id="cpf"
            placeholder="CPF"
        >

        <input
            type="text"
            id="rg"
            placeholder="RG"
        >

        <input
            type="date"
            id="dataNascimento"
        >

        <select id="sexo">
            <option value="">Selecione o sexo</option>
            <option value="Masculino">Masculino</option>
            <option value="Feminino">Feminino</option>
            <option value="Outro">Outro</option>
            <option value="Nao informado">Prefiro não informar</option>
        </select>

        <input
            type="text"
            id="nomeMae"
            placeholder="Nome da mãe"
        >

        <select id="estadoCivil">
            <option value="">Estado civil</option>
            <option value="Solteiro">Solteiro(a)</option>
            <option value="Casado">Casado(a)</option>
            <option value="Divorciado">Divorciado(a)</option>
            <option value="Viuvo">Viúvo(a)</option>
            <option value="Uniao estavel">União estável</option>
        </select>


        <!-- Endereço -->

        <input
            type="text"
            id="endereco"
            placeholder="Endereço completo"
        >


        <!-- Contato -->

        <input
            type="tel"
            id="telefone"
            placeholder="Telefone"
        >

        <input
            type="email"
            id="email"
            placeholder="E-mail"
        >

        <input
            type="tel"
            id="contatoEmergencia"
            placeholder="Contato de emergência"
        >


        <!-- Tipo de atendimento -->

        <select id="tipo">
            <option value="Convenio">Convênio</option>
            <option value="Particular">Particular</option>
        </select>


        <!-- Foto -->

        <input
            type="file"
            id="foto"
            accept="image/*"
        >


        <button onclick="cadastrar()">
            Cadastrar
        </button>

    </div>


    <script>

        function cadastrar() {

            const nome = document.getElementById("nome").value.trim();
            const cpf = document.getElementById("cpf").value.trim();
            const rg = document.getElementById("rg").value.trim();
            const dataNascimento =
                document.getElementById("dataNascimento").value;

            const sexo = document.getElementById("sexo").value;

            const nomeMae =
                document.getElementById("nomeMae").value.trim();

            const estadoCivil =
                document.getElementById("estadoCivil").value;

            const endereco =
                document.getElementById("endereco").value.trim();

            const telefone =
                document.getElementById("telefone").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const contatoEmergencia =
                document.getElementById("contatoEmergencia").value.trim();

            const tipo =
                document.getElementById("tipo").value;


            // Campos obrigatórios

            if (
                !nome ||
                !cpf ||
                !rg ||
                !dataNascimento ||
                !sexo ||
                !nomeMae ||
                !estadoCivil ||
                !endereco ||
                !telefone ||
                !email ||
                !contatoEmergencia
            ) {

                alert("Preencha todos os campos obrigatórios.");

                return;
            }


            fetch("http://localhost:3000/atendimento", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    nome: nome,

                    cpf: cpf,

                    rg: rg,

                    dataNascimento: dataNascimento,

                    sexo: sexo,

                    nomeMae: nomeMae,

                    estadoCivil: estadoCivil,

                    endereco: endereco,

                    telefone: telefone,

                    email: email,

                    contatoEmergencia: contatoEmergencia,

                    tipo: tipo

                })

            })

            .then(response => {

                if (!response.ok) {
                    throw new Error("Erro ao cadastrar paciente.");
                }

                return response.json();

            })

            .then(data => {

                if (data.sucesso) {

                    alert("Paciente enviado para triagem!");


                    // Limpa todos os campos

                    document.getElementById("nome").value = "";
                    document.getElementById("cpf").value = "";
                    document.getElementById("rg").value = "";
                    document.getElementById("dataNascimento").value = "";
                    document.getElementById("sexo").value = "";
                    document.getElementById("nomeMae").value = "";
                    document.getElementById("estadoCivil").value = "";
                    document.getElementById("endereco").value = "";
                    document.getElementById("telefone").value = "";
                    document.getElementById("email").value = "";
                    document.getElementById("contatoEmergencia").value = "";
                    document.getElementById("tipo").value = "Convenio";
                    document.getElementById("foto").value = "";

                } else {

                    alert(
                        data.erro ||
                        "Não foi possível cadastrar o paciente."
                    );

                }

            })

            .catch(erro => {

                console.error("Erro:", erro);

                alert(
                    "Não foi possível conectar ao servidor."
                );

            });

        }

    </script>

</body>

</html>
